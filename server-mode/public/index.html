<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IAMMETER Realtime Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    /* =============================
       ✨ 全局深色工业风主题
    ============================== */
    body {
      font-family: 'Segoe UI', Roboto, sans-serif;
      background: radial-gradient(circle at top, #0f172a, #020617);
      color: #e2e8f0;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    h1 {
      color: #38bdf8;
      text-shadow: 0 0 12px rgba(56, 189, 248, 0.8);
      margin: 20px 0 10px 0;
      font-size: 2rem;
    }

    /* ✅ 顶部状态栏 */
    #status {
      display: flex;
      align-items: center;
      gap: 15px;
      font-style: italic;
      color: #94a3b8;
      margin-bottom: 15px;
    }

    #connection-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: red;
      box-shadow: 0 0 8px red;
      animation: blink 1.5s infinite alternate;
    }

    @keyframes blink {
      0% { opacity: 0.4; }
      100% { opacity: 1; }
    }

    #update-time {
      color: #38bdf8;
      font-weight: bold;
      font-size: 0.9rem;
    }

    /* =============================
       ✨ 主体区域布局
    ============================== */
    #dashboard {
      display: flex;
      justify-content: center;
      align-items: stretch;
      width: 95%;
      max-width: 1200px;
      gap: 25px;
      flex-wrap: wrap;
    }

    /* ✅ 左侧 Phase 卡片列 */
    #phases {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 15px;
      flex: 0 0 280px;
    }

    .phase {
      background: linear-gradient(145deg, #1e293b, #0f172a);
      border-radius: 12px;
      padding: 18px;
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.2);
      transition: all 0.2s ease;
      border: 1px solid rgba(56, 189, 248, 0.2);
    }

    .phase:hover {
      transform: scale(1.03);
      box-shadow: 0 0 25px rgba(56, 189, 248, 0.5);
    }

    .phase h2 {
      color: #38bdf8;
      font-size: 1.2em;
      margin-bottom: 8px;
    }

    .data {
      font-size: 1em;
      color: #94a3b8;
      margin: 3px 0;
      text-align: left;
    }

    .value {
      font-weight: bold;
      color: #f8fafc;
      text-shadow: 0 0 6px #3b82f6;
    }

    /* ✅ 右侧图表 */
    #chart-container {
      flex: 1;
      background: linear-gradient(145deg, #1e293b, #0f172a);
      border-radius: 12px;
      padding: 20px 25px;
      box-shadow: 0 0 20px rgba(56, 189, 248, 0.15);
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    /* 顶部选择框放在图表左上角 */
    #chart-header {
      position: absolute;
      top: 15px;
      left: 20px;
    }

    #metric-selector {
      background: #0f172a;
      color: #e2e8f0;
      border: 1px solid #38bdf8;
      border-radius: 6px;
      padding: 4px 10px;
      font-size: 0.95em;
      outline: none;
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.4);
    }

    #metric-selector:hover {
      background: #1e293b;
    }

    canvas {
      width: 100% !important;
      height: 420px !important;
    }
  </style>
</head>
<body>
  <h1>⚡ IAMMETER Real-Time Energy Monitor</h1>

  <!-- ✅ 状态栏 -->
  <div id="status">
    <div id="connection-dot"></div>
    <span id="connection-status">Connecting...</span>
    <span id="update-time"></span>
  </div>

  <!-- ✅ 主体区域：左相卡片 + 右实时图 -->
  <div id="dashboard">
    <div id="phases"></div>

    <div id="chart-container">
      <div id="chart-header">
        <select id="metric-selector">
          <option value="voltage">Voltage (V)</option>
          <option value="current">Current (A)</option>
          <option value="power">Power (W)</option>
        </select>
      </div>
      <canvas id="realtimeChart"></canvas>
    </div>
  </div>

  <script>
    const ws = new WebSocket(`ws://${location.host}`);
    const phasesDiv = document.getElementById('phases');
    const connDot = document.getElementById('connection-dot');
    const connStatus = document.getElementById('connection-status');
    const updateTime = document.getElementById('update-time');
    const selector = document.getElementById('metric-selector');
    const ctx = document.getElementById('realtimeChart').getContext('2d');

    // ✅ Chart.js 渐变色定义
    const gradientA = ctx.createLinearGradient(0, 0, 0, 400);
    gradientA.addColorStop(0, 'rgba(239,68,68,1)');
    gradientA.addColorStop(1, 'rgba(239,68,68,0)');
    const gradientB = ctx.createLinearGradient(0, 0, 0, 400);
    gradientB.addColorStop(0, 'rgba(250,204,21,1)');
    gradientB.addColorStop(1, 'rgba(250,204,21,0)');
    const gradientC = ctx.createLinearGradient(0, 0, 0, 400);
    gradientC.addColorStop(0, 'rgba(34,197,94,1)');
    gradientC.addColorStop(1, 'rgba(34,197,94,0)');

    const chartData = {
      labels: [],
      datasets: [
        { label: 'Phase A', borderColor: '#ef4444', backgroundColor: gradientA, data: [], fill: true, tension: 0.4 },
        { label: 'Phase B', borderColor: '#facc15', backgroundColor: gradientB, data: [], fill: true, tension: 0.4 },
        { label: 'Phase C', borderColor: '#22c55e', backgroundColor: gradientC, data: [], fill: true, tension: 0.4 },
      ]
    };

    const chartOptions = {
      responsive: true,
      animation: false,
      plugins: {
        legend: { labels: { color: '#cbd5e1' } }
      },
      scales: {
        x: {
          ticks: { color: '#94a3b8' },
          grid: { color: 'rgba(148,163,184,0.1)' }
        },
        y: {
          ticks: { color: '#94a3b8' },
          grid: { color: 'rgba(148,163,184,0.1)' }
        }
      }
    };

    const realtimeChart = new Chart(ctx, {
      type: 'line',
      data: chartData,
      options: chartOptions
    });

    // ✅ WebSocket 状态与数据刷新
    ws.onopen = () => {
      connDot.style.background = '#22c55e';
      connDot.style.boxShadow = '0 0 10px #22c55e';
      connStatus.textContent = "Connected";
    };
    ws.onclose = () => {
      connDot.style.background = 'red';
      connDot.style.boxShadow = '0 0 10px red';
      connStatus.textContent = "Disconnected";
    };

    ws.onmessage = (event) => {
      const data = JSON.parse(event.data);
      phasesDiv.innerHTML = '';
      data.phases.forEach((p, i) => {
        const phaseLabel = data.type === 'three' ? `Phase ${['A','B','C'][i]}` : 'Single Phase';
        phasesDiv.innerHTML += `
          <div class="phase">
            <h2>${phaseLabel}</h2>
            <div class="data">Voltage: <span class="value">${p.voltage.toFixed(2)} V</span></div>
            <div class="data">Current: <span class="value">${p.current.toFixed(2)} A</span></div>
            <div class="data">Power: <span class="value">${p.power.toFixed(2)} W</span></div>
          </div>
        `;
      });

      // 更新时间
      const now = new Date();
      updateTime.textContent = `Last update: ${now.toLocaleTimeString()}`;

      // 更新图表
      const selectedMetric = selector.value;
      const nowLabel = now.toLocaleTimeString().split(' ')[0];
      if (chartData.labels.length >= 40) {
        chartData.labels.shift();
        chartData.datasets.forEach(d => d.data.shift());
      }
      chartData.labels.push(nowLabel);
      if (data.type === 'three') {
        data.phases.forEach((p, i) => chartData.datasets[i].data.push(p[selectedMetric]));
      } else {
        chartData.datasets[0].data.push(data.phases[0][selectedMetric]);
      }
      realtimeChart.update();
    };
  </script>
</body>
</html>
